[project]
name = "transcribe"
version = "0.1.0"
description = "Structured transcription of handwritten diary pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-vlm>=0.7.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
